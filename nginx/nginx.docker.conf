#用户
user nginx;
#工作进程数量
worker_processes auto;
#pid保存位置
pid       /run/nginx.pid;
#错误日志保存位置
error_log /var/log/nginx/error.log error;

events {
  #工作进程最大同时连接数
  worker_connections 1024;
}

http {
  #MIME类型
  include      /etc/nginx/mime.types;
  #默认MIME类型
  default_type application/octet-stream;
  #启用sendfile服务器可以直接从硬盘读取文件并发送到客户端，而不需要先把文件全部读到内存里
  sendfile    on;
  #启用tcp_nopush适用于大文件传输
  tcp_nopush  on;
  #启用tcp_nodelay适用于快速响应的小型数据包(不可与tcp_nopush同时使用)
  # tcp_nodelay on;
  #保活超时时间
  keepalive_timeout 65;
  #不显示nginx版本号
  server_tokens     off;
  #启用gzip压缩
  # gzip              on;

  #访问日志格式
  log_format main "$time_iso8601 [$remote_addr:$remote_port] [$status] $request_method $scheme://$host$request_uri";
  #访问日志保存位置
  access_log /var/log/nginx/access.log main;

  #SSL设置
  ssl_protocols TLSv1 TLSv1.1 TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers on;

  ##http://404z.cn
  #http服务
  # server {
  #   #监听端口
  #   listen      80;
  #   #服务名称
  #   server_name 404z.cn;

  #   #http跳转到https
  #   rewrite (.*) https://web.$host$1 permanent;
  # }

  ##http://web.404z.cn
  #http服务
  server {
    #监听端口
    listen      80;
    #服务名称
    server_name web.404z.cn;

    #http跳转到https
    rewrite (.*) https://$host$1 permanent;
  }

  ##https://web.404z.cn
  #https服务
  server {
    #监听端口
    listen      443 ssl;
    #服务名称
    server_name web.404z.cn;
    #根路径
    root  /app;

    #404跳转
    error_page 404 /404.html;
    #50x跳转
    error_page 500 502 503 504 /50x.html;

    #证书pem文件(放到/docker/nginx/conf/cert路径下)
    ssl_certificate     /etc/nginx/cert/web.404z.cn.pem;
    #证书key文件(放到/docker/nginx/conf/cert路径下)
    ssl_certificate_key /etc/nginx/cert/web.404z.cn.key;
    #证书其他配置
    ssl_session_cache         shared:SSL:1m;
    ssl_session_timeout       5m;
    ssl_ciphers               HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    #首页跳转
    location / {
      root  /app/blog;
      index index.php;
    }

    #PHP反向代理
    location ~ \.php$ {
      root          /app/blog;
      fastcgi_pass  php:9000;
      fastcgi_index index.php;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      include       fastcgi_params;
    }

    #WebSocket页面跳转
    location /ws/ {
      index ws.html;
    }

    #增加前缀反向代理
    location /api/ {
      proxy_pass       http://host.docker.internal:8080/;
      proxy_set_header X-Real-IP   $remote_addr;
      proxy_set_header X-Real-Port $remote_port;
    }

    #WebSocket反向代理
    location = /api/ws {
      proxy_pass       http://host.docker.internal:8080/ws;
      proxy_set_header Connection "upgrade";
      proxy_set_header Upgrade    "websocket";
    }

    #保留前缀反向代理
    location /jenkins/ {
      proxy_pass       http://host.docker.internal:8081/jenkins/;
      proxy_set_header X-Real-IP $remote_addr;
    }

  }

}
